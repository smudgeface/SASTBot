# SASTBot production nginx config.
#
# The frontend container serves three roles:
#   1. Static SPA host (Vite-built React bundle in /usr/share/nginx/html).
#   2. Reverse proxy for /api/* -> backend:8000 (Fastify).
#   3. Reverse proxy for /healthz, /version, /openapi.json, /docs ->
#      backend:8000. These four paths stay at the root by convention so
#      operators / monitoring probe them at the public hostname directly.
#
# Backend is reachable as `backend` on the compose-internal Docker network.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow tarball backup uploads through the restore endpoint. The default
  # of 1M would truncate any non-trivial DB dump.
  client_max_body_size 100M;

  # Re-resolve the backend hostname at request time instead of caching its IP
  # at startup. With a literal `proxy_pass http://backend:8000`, nginx resolves
  # `backend` ONCE on boot; if the backend container is later recreated with a
  # new IP (e.g. an upgrade that pulls a new tag and `up -d` replaces only the
  # backend), nginx keeps proxying to the dead old IP and every request 502s
  # ("Host is unreachable") until nginx itself restarts. Using Docker's embedded
  # DNS (127.0.0.11) via a `resolver` + a variable in `proxy_pass` forces
  # per-request resolution (cached `valid=10s`), so a recreated backend is
  # picked up within seconds. Every proxied path below is identical on the
  # upstream, so a bare `http://$sastbot_backend` (no URI part) forwards the
  # original request URI unchanged.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $sastbot_backend "backend:8000";

  # Sensible logging defaults — Dokploy ships container stdout to its
  # log aggregator, so just rely on the nginx defaults.

  # ---------------------------------------------------------------------
  # /api/* -> Fastify
  # ---------------------------------------------------------------------
  # No trailing path on proxy_pass so nginx forwards the full original
  # URI (including the /api prefix). The backend's parent register adds
  # the /api prefix to all domain routes, so /api/auth/login on nginx
  # matches /api/auth/login on Fastify.
  location /api/ {
    proxy_pass http://$sastbot_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Scans stream slow progress for minutes during long detection phases;
    # don't let nginx kill the connection mid-stream.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # ---------------------------------------------------------------------
  # Operational endpoints kept at root
  # ---------------------------------------------------------------------
  location = /healthz {
    proxy_pass http://$sastbot_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /version {
    proxy_pass http://$sastbot_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /openapi.json {
    proxy_pass http://$sastbot_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /docs {
    proxy_pass http://$sastbot_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---------------------------------------------------------------------
  # SPA fallback
  # ---------------------------------------------------------------------
  location / {
    try_files $uri /index.html;
  }
}
