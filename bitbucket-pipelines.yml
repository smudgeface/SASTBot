# SASTBot CI — test gates + container image build/push to Bitbucket Packages.
#
# Registry: crg.apkg.io/<workspace>  (workspace resolved at runtime via
# $BITBUCKET_WORKSPACE — never hardcoded, so no tenant identifier lives here).
#
# Push auth is native: Bitbucket Pipelines injects $BITBUCKET_PACKAGES_USERNAME
# and $BITBUCKET_PACKAGES_TOKEN into every step. No secrets are committed here.
#
# Trigger model (tags-only release builds; see CONTRIBUTING.md for the branch flow):
#   - pull requests     -> test gate only (guards every feature branch pre-merge)
#   - push to develop   -> test gate only (the primary integration branch)
#   - push to main      -> test gate only (release candidate)
#   - push tag vX.Y.Z   -> test gate, then build & push images (the deploy step)
#   - custom (manual)   -> "build-and-push-images" from the UI: full gate + push
#
# Image tags per build: latest, X.Y.Z, X.Y.Z-<short-sha>.
# Version source of truth: backend/package.json .version (the CLAUDE.md 3-file
# bump policy keeps it equal to frontend/package.json and APP_VERSION; the test
# step's drift guard fails the build if they disagree).

image: node:20-bookworm

definitions:
  caches:
    pnpm-store:
      key:
        files:
          - backend/pnpm-lock.yaml
      path: $HOME/.pnpm-store
    frontend-npm:
      key:
        files:
          - frontend/package-lock.json
      path: $HOME/.npm
  services:
    # Ephemeral Postgres for the test gate. Several backend tests reach a real
    # DB (some Prisma mocks are incomplete and fall through to a live client);
    # they pass against an empty migrated schema, mirroring how the suite runs
    # locally via `docker compose exec backend pnpm test`. Reachable at
    # localhost:5432 from the step container.
    postgres:
      image: postgres:16
      variables:
        POSTGRES_USER: sastbot
        POSTGRES_PASSWORD: sastbot
        POSTGRES_DB: sastbot
    # Some teardown paths open a BullMQ/ioredis connection; without a reachable
    # Redis the suite logs ECONNREFUSED noise. Reachable at localhost:6379.
    redis:
      image: redis:7
  steps:
    - step: &test
        name: Test, typecheck & version-drift guard
        caches:
          - pnpm-store
          - frontend-npm
        services:
          - postgres
          - redis
        script:
          - corepack enable && corepack prepare pnpm@10.33.4 --activate
          # --- version drift guard: enforce the CLAUDE.md 3-file policy in CI ---
          - BE=$(node -p "require('./backend/package.json').version")
          - FE=$(node -p "require('./frontend/package.json').version")
          - AV=$(node -e "const s=require('fs').readFileSync('backend/src/routes/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*\"([^\"]+)\"/);process.stdout.write(m?m[1]:'MISSING')")
          - echo "versions backend=$BE frontend=$FE APP_VERSION=$AV"
          - if [ "$BE" != "$FE" ] || [ "$BE" != "$AV" ]; then echo "Version drift across the 3 surfaces (backend/frontend package.json + APP_VERSION) — fix before release"; exit 1; fi
          # --- backend test env: empty migrated DB + Redis + writable artifact dirs.
          # MASTER_KEY is an ephemeral throwaway (no real data) generated per run;
          # some modules load config at import, before tests can set fake env. ---
          - export DATABASE_URL="postgresql://sastbot:sastbot@localhost:5432/sastbot"
          - export REDIS_URL="redis://localhost:6379/0"
          - export ARTIFACT_DIR="/tmp/sastbot-artifacts"
          - export CLONE_CACHE_DIR="/tmp/sastbot-clones"
          - export MASTER_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          - cd backend
          - pnpm config set store-dir $HOME/.pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm prisma generate
          - pnpm prisma migrate deploy
          - pnpm typecheck
          - pnpm test
          - cd ..
          # --- frontend: tsc + vitest (the vite build runs inside the docker build) ---
          - cd frontend
          - npm ci
          - npm run typecheck
          - npm test
    - step: &build-push
        name: Build & push images to crg.apkg.io
        # 1x (4 GB; docker daemon capped at 3 GB) is sufficient: the heaviest
        # in-build step is the frontend `vite build`, measured at ~0.55 GB peak
        # RSS locally. Bump to `size: 2x` only if a cloud build OOMs (exit 137).
        services:
          - docker
        caches:
          - docker
        script:
          - export VERSION=$(node -p "require('./backend/package.json').version")
          - export SHA=${BITBUCKET_COMMIT:0:7}
          - export REG="crg.apkg.io/$BITBUCKET_WORKSPACE"
          - echo "Building SASTBot $VERSION ($SHA) -> $REG"
          # On a tag-triggered build, the git tag must match the package version.
          - if [ -n "$BITBUCKET_TAG" ] && [ "$BITBUCKET_TAG" != "v$VERSION" ]; then echo "Git tag $BITBUCKET_TAG != v$VERSION (backend/package.json) — bump the 3 version files or retag"; exit 1; fi
          - docker login crg.apkg.io -u "$BITBUCKET_PACKAGES_USERNAME" -p "$BITBUCKET_PACKAGES_TOKEN"
          # backend image (shared by the backend + worker services)
          - docker build -f docker/backend.Dockerfile  --target prod
            -t "$REG/sastbot-backend:latest"
            -t "$REG/sastbot-backend:$VERSION"
            -t "$REG/sastbot-backend:$VERSION-$SHA" .
          # frontend image (nginx serving the built SPA)
          - docker build -f docker/frontend.Dockerfile --target prod
            -t "$REG/sastbot-frontend:latest"
            -t "$REG/sastbot-frontend:$VERSION"
            -t "$REG/sastbot-frontend:$VERSION-$SHA" .
          - docker push -a "$REG/sastbot-backend"
          - docker push -a "$REG/sastbot-frontend"

pipelines:
  pull-requests:
    "**":                         # any source branch → test gate before merge
      - step: *test
  branches:
    develop:
      - step: *test
    main:
      - step: *test
  tags:
    "v*":
      - step: *test
      - step: *build-push
  custom:
    build-and-push-images:        # manual trigger from the Bitbucket UI
      - step: *test
      - step: *build-push
